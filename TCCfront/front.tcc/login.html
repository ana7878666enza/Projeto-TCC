<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SASC - Sistema de Análise de Satisfação do Cliente. Acesse sua conta para gerenciar feedbacks e relatórios.">
  <meta name="theme-color" content="#0052cc">
  <title>Login - SASC</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">SASC</div>

    <!-- Mensagens de Erro e Sucesso -->
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <!-- Formulário de Login -->
    <form class="login-form" id="loginForm" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        >
        <span class="input-icon">✉️</span>
      </div>

      <!-- ID da Empresa -->
      <div class="form-group">
        <label for="companyId">ID da Empresa</label>
        <input
          type="text"
          id="companyId"
          name="companyId"
          placeholder="Ex: 54546565"
          required
          autocomplete="off"
        >
        <span class="input-icon">🏢</span>
      </div>

      <!-- Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
        <span class="input-icon">🔒</span>
        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar/ocultar senha">
          👁️
        </button>
      </div>

      <!-- Link Esqueceu Senha -->
      <div class="forgot-password">
        <a href="#forgot-password" id="forgotPasswordLink">Esqueceu sua senha?</a>
      </div>

      <!-- Botão Entrar -->
      <button type="submit" class="btn-login" id="submitBtn">Entrar</button>
    </form>

    <!-- Rodapé -->
    <div class="login-footer">
      <p>Acesse sua conta para gerenciar os dados de satisfação</p>
      <p style="margin-top: 12px; font-size: 11px; color: #7a8fa6;">
        © 2026 SASC. Todos os direitos reservados.
      </p>
    </div>
  </div>

  <!-- Modal de Recuperação de Senha (oculto por padrão) -->
  <div id="forgotPasswordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #1a2f4a; border: 2px solid #2d4a6f; border-radius: 12px; padding: 30px; max-width: 400px; width: 90%;">
      <h2 style="color: white; margin-bottom: 16px; font-size: 20px;">Recuperar Senha</h2>
      <p style="color: #a0aec0; margin-bottom: 20px; font-size: 14px;">Digite seu email para receber instruções de recuperação.</p>
      <input
        type="email"
        id="recoveryEmail"
        placeholder="seu@email.com"
        style="width: 100%; padding: 10px 12px; background: rgba(45, 74, 111, 0.5); border: 1px solid #2d4a6f; border-radius: 6px; color: white; margin-bottom: 16px; font-size: 14px;"
      >
      <div style="display: flex; gap: 12px;">
        <button id="cancelRecovery" style="flex: 1; padding: 10px; background: #2d4a6f; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Cancelar</button>
        <button id="sendRecovery" style="flex: 1; padding: 10px; background: #0052cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Enviar</button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
